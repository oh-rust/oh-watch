[package]
name = "oh-watch"
version = "0.1.3"
edition = "2024"
authors =["hidu"]
description= """oh-watch is a file watcher with automatic command reloading.
It monitors your project for file changes and automatically restarts
a specified command whenever changes are detected.

Site: https://github.com/oh-rust/oh-watch
"""
license = "MIT"
repository = "https://github.com/oh-rust/oh-watch"
readme = "README.md"
keywords = ["watch", "tool","inotify","fswatch"]
categories = ["development-tools"]
exclude =["/.github/"]

[dependencies]
chrono = "0.4.45"
clap ={ version="4.6.0",features = ["derive"]}
colored = "3.1.1"
command-group = "5.0.1"
ctrlc = "3.5.2"
env = "1.0.1"
globset = "0.4.20"
nix = "0.31.3"
notify = "8.2.0"
tokio = {version = "1.53.1",features = ["macros", "sync", "rt-multi-thread","time"]}


[profile.release]
lto = true          # Link Time Optimization
codegen-units = 1   # 减少生成单元，提高优化空间
opt-level = "z"     # "z" 优化体积，"s" 优化大小，默认 "3" 优化速度
